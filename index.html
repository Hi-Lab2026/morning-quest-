z-index:3}.navinner{width:min(540px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav{border:0;background:transparent;color:#a7b7c2;padding:9px 3px;border-radius:12px;font-size:12px;font-weight:750}.nav.active{background:#25473f;color:#8df2c5}.nav b{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}.exercise{display:flex;align-items:flex-start;gap:13px}.num{height:36px;width:36px;flex:0 0 36px;border-radius:11px;background:#294e48;color:#85edbe;display:grid;place-items:center;font-weight:850}.exbody{flex:1;min-width:0}.exbody h3{margin:0 0 7px;font-size:17px}.exbody p{margin:4px 0;font-size:13px;line-height:1.6;color:#afc4ce}.meter{height:8px;background:#334b55;border-radius:99px;overflow:hidden;margin:13px 0}.meter i{display:block;height:100%;background:#6fe5bb;border-radius:99px;transition:width .2s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;background:#314759;padding:5px 9px;border-radius:10px;color:#cbe1e7}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.field label{display:block;font-size:12px;color:#a9bcc8;margin-bottom:6px}.field input,.field select{background:#11212f;color:#edf7f8;border:1px solid #405667;border-radius:11px;padding:12px;width:100%;min-width:0}.help{font-size:12px;color:#aabfcc;line-height:1.8}.steps{padding-left:19px;color:#c8dce4;font-size:13px;line-height:1.9}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:#1c3040;color:#a4b8c7;font-size:13px}.day.done{background:#276b57;color:#daffed;font-weight:800}.day.partial{background:#736039;color:#fff1bf}.day.rest{background:#192839;color:#566f7b}.weekday{text-align:center;color:#849eac;font-size:11px;margin-bottom:7px}.barlist{display:flex;align-items:end;gap:9px;height:135px;padding-top:12px}.barcol{flex:1;min-width:0;text-align:center;font-size:11px;color:#9 /* MORNING QUEST v3 — Proposal 5 visual alignment */
:root { color:#f0f8fa; }
body { background:radial-gradient(ellipse at 90% 1%,#18424b 0%,#0e2432 32%,#0c1828 72%,#0a1726 100%); }
.shell { max-width:540px; padding:35px 29px 26px; }
.eyebrow {font-size:12px;letter-spacing:.24em;color:#63e6ba;font-weight:700;}

.exercise .exbody summary::-webkit-details-marker{display:none}

.navinner{width:100%;gap:8px}

</style></head><body><main class="shell"><div class="top-actions"><span class="eyebrow">BUILD YOUR ROUTINE</span><span class="badge" id="savedBadge">端末内に保存</span></div><h1 class="title">MORNING <span style="color:#6ce2b7">QUEST</span></h1><div class="date" id="todayLabel"></div><div id="home"></div><div id="workout" class="hidden"></div><div id="progress" class="hidden"></div><div id="settings" class="hidden"></div><div class="footer">無理なく続けることが目標です。痛みや体調不良がある日は休みましょう。<br>データはこの端末のブラウザ内に保存されます。</div></main><nav class="bottom"><div class="navinner"><button class="nav active" data-tab="home"><b>⌂</b>HOME</button><button class="nav" data-tab="workout"><b>◉</b>WORKOUT</button><button class="nav" data-tab="progress"><b>▥</b>PROGRESS</button></div></nav><script>
(()=>{'use strict';const KEY='morning_quest_v1',TZ='Asia/Tokyo';const DEFS=[{id:'squat',name:'ゴブレットスクワット',sets:2,reps:12,kg:7.5,unit:'回',guide:['ダンベル1個を両手で持ち、胸の前に置きます。','足を肩幅程度に開き、お尻を後ろに引きながらしゃがみます。','膝とつま先を同じ方向に保ち、足裏で床を押して立ちます。'],caution:'腰を反らしすぎず、痛みのない深さで。'},{id:'row',name:'ダンベルローイング',sets:1,reps:10,kg:0,unit:'回/左右',guide:['片手にダンベルを持ち、反対の手を丈夫な台について上体を倒します。','背中を保ち、肘を腰に向けて引きます。','反動を使わずゆっくり下ろし、左右を交代します。'],caution:'重量は未設定です。無理のない重量を入力してください。'},{id:'curl',name:'アームカール',sets:1,reps:10,kg:7.5,unit:'回/左右',guide:['手のひらを前に向けてダンベルを持ちます。','肘を体の横に保ち、肘を曲げて持ち上げます。','体を揺らさずゆっくり下ろします。'],caution:'10回終えてあと2〜3回できる余裕を目安に。'},{id:'triceps',name:'上腕三頭筋エクステンション',sets:1,reps:10,kg:0,unit:'回/左右',guide:['片手で軽いダンベルを持ち、腕を頭上に伸ばします。','肘をゆっくり曲げて頭の後ろに下ろします。','肘を伸ばし、左右を交代します。'],caution:'7.5kgを無理に使わず、肩・肘に痛みが出ない重量で。'},{id:'plank',name:'プランク',sets:2,reps:25,kg:0,unit:'秒',guide:['肘を肩の真下につき、前腕とつま先で体を支えます。','頭からかかとまでを一直線に保ちます。','呼吸を止めず、自然に呼吸します。'],caution:'腰が反る場合は膝を床につけて短時間に。'}];const z=n=>String(n).padStart(2,'0');function day(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function dateOf(s){return new Date(s+'T12:00:00+09:00')}function add(s,n){const d=dateOf(s);d.setDate(d.getDate()+n);return day(d)}function diff(a,b){return Math.round((dateOf(a)-dateOf(b))/86400000)}function fmt(s){return new Intl.DateTimeFormat('ja-JP',{timeZone:TZ,month:'long',day:'numeric',weekday:'long'}).format(dateOf(s))}function defaultState(){return{created:day(),sessions:[],plan:DEFS.map(x=>({...x})),schedule:'alternate',lastReview:'',goals:{},restDays:[]}}let db;try{const parsed=JSON.parse(localStorage.getItem(KEY));db=parsed&&Array.isArray(parsed.sessions)&&Array.isArray(parsed.plan)?parsed:defaultState()}catch{db=defaultState()}let currentTab='home',run=null,mode='full';function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function planned(d){return diff(d,db.created)%2===0}function session(d){return db.sessions.find(s=>s.date===d&&s.status==='completed')}function countSince(n){let r=0;for(let i=0;i<n;i++)if(session(add(day(),-i)))r++;return r}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2400)}function setTab(t){currentTab=t;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['home','workout','progress','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));function stats(){let plan=0,done=0;for(let i=0;i<28;i++){let d=add(day(),-i);if(d<db.created)continue;if(planned(d)){plan++;if(session(d))done++}}return{plan,done,rate:plan?Math.round(done/plan*100):0}}function renderHome(){const now=day(),done=session(now),rest=!planned(now),s=stats();document.getElementById('todayLabel').textContent=fmt(now);document.getElementById('home').innerHTML=`<div class="card hero section"><span class="tag">${done?'✓ 今日の運動を記録済み':rest?'☾ 回復日':'✦ 今日のミッション'}</span><h2>${done?'今日も積み重ねました':rest?'今日は回復を大切に':'朝の15分、始めよう'}</h2><p class="muted">${done?'記録を確認できます。必要なら無理なく休養を。':rest?'予定された休息日です。軽い散歩は自由に選べます。':'自分のペースで、フォームを丁寧に。'}</p><div class="btnrow"><button class="btn" id="startFull">${done?'記録を見る':rest?'運動メニューを見る':'トレーニング開始'}</button><button class="btn secondary" id="startShort">5分だけ</button></div></div><section class="section"><h2>積み重ねた記録</h2><div class="grid"><div class="stat"><strong>${countSince(7)}</strong><span>直近7日 / 回</span></div><div class="stat"><strong>${db.sessions.filter(x=>x.status==='completed').length}</strong><span>累計 / 回</span></div><div class="stat"><strong>${s.rate}%</strong><span>28日実施率</span></div></div></section><div class="card"><div class="row"><b>今日のひとこと</b><span class="pill">継続のヒント</span></div><p class="help">${db.sessions.length===0?'最初の1回を記録すると、ここに実績が表示されます。':countSince(7)>0?`直近7日で${countSince(7)}回、運動を記録しました。焦らず自分のペースで続けましょう。`:'今日は小さな一歩でも十分です。休息も計画の一部です。'}</p></div><div class="card"><div class="row"><b>設定・バックアップ</b><button class="btn secondary sm" id="openSettings" style="width:auto">設定を開く →</button></div><p class="help">種目の回数や重量を変更し、記録をファイルに保存できます。</p></div>`;document.getElementById('startFull').onclick=()=>{mode='full';run=null;setTab('workout')};document.getElementById('startShort').onclick=()=>{mode='short';run=null;setTab('workout')};document.getElementById('openSettings').onclick=()=>{currentTab='settings';['home','workout','progress','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!=='settings'));document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));render();window.scrollTo(0,0)}}function activePlan(){return mode==='short'?db.plan.filter(x=>['squat','row'].includes(x.id)).map(x=>({...x,sets:1})):db.plan}function motionIcon(id){const shapes={
 squat:`<g transform="translate(1 0)"><circle class="person" cx="21" cy="13" r="6"/><path class="person" d="M21 20 L21 39 M21 26 L12 31 L18 38 M21 26 L30 31 L24 38 M21 39 L12 49 L8 60 M21 39 L30 49 L34 60 M8 60 H16 M30 60 H38"/><rect class="weight" x="17" y="26" width="9" height="10" rx="2"/></g><g transform="translate(54 1)"><circle class="person" cx="20" cy="13" r="6"/><path class="person" d="M20 20 L20 38 M20 26 L12 31 L17 38 M20 26 L28 31 L23 38 M20 38 L9 43 L8 58 M20 38 L32 43 L33 58 M5 59 H16 M28 59 H39"/><rect class="weight" x="16" y="26" width="9" height="10" rx="2"/></g><path class="arrow" d="M45 35 H53 M49 31 L53 35 L49 39 M101 20 V34 M97 30 L101 34 L105 30"/>`,
 row:`<g><circle class="person" cx="21" cy="16" r="5"/><path class="person" d="M18 22 L11 37 L26 41 M12 37 L7 58 M26 41 L32 58 M7 58 H17 M29 58 H37 M18 30 L25 39 L25 52"/><rect class="weight" x="20" y="50" width="9" height="5" rx="1"/></g><g transform="translate(55 0)"><circle class="person" cx="21" cy="16" r="5"/><path class="person" d="M18 22 L11 37 L26 41 M12 37 L7 58 M26 41 L32 58 M7 58 H17 M29 58 H37 M18 29 L30 34 L36 30"/><rect class="weight" x="32" y="28" width="9" height="5" rx="1"/></g><path class="arrow" d="M47 37 H55 M51 33 L55 37 L51 41"/>`,
 curl:`<g><circle class="person" cx="20" cy="13" r="6"/><path class="person" d="M20 20 V44 M20 27 L10 30 V46 M20 27 L30 30 V46 M20 44 L13 61 M20 44 L27 61"/><rect class="weight" x="6" y="43" width="10" height="6" rx="2"/><rect class="weight" x="25" y="43" width="10" height="6" rx="2"/></g><g transform="translate(56 0)"><circle class="person" cx="20" cy="13" r="6"/><path class="person" d="M20 20 V44 M20 27 L10 30 V46 M20 27 L29 30 L33 23 M20 44 L13 61 M20 44 L27 61"/><rect class="weight" x="6" y="43" width="10" height="6" rx="2"/><rect class="weight" x="29" y="19" width="10" height="6" rx="2"/></g><path class="arrow" d="M47 36 H55 M51 32 L55 36 L51 40"/>`,
 triceps:`<g><circle class="person" cx="18" cy="22" r="6"/><path class="person" d="M18 30 V54 M18 54 L11 66 M18 54 L25 66 M18 34 L10 17 L17 7 M18 34 L27 17 L20 7"/><rect class="weight" x="13" y="3" width="12" height="6" rx="2"/></g><g transform="translate(58 0)"><circle class="person" cx="18" cy="22" r="6"/><path class="person" d="M18 30 V54 M18 54 L11 66 M18 54 L25 66 M18 34 L8 18 L15 10 M18 34 L28 18 L22 9"/><rect class="weight" x="16" y="7" width="12" height="6" rx="2"/></g><path class="arrow" d="M45 34 H55 M51 30 L55 34 L51 38 M101 12 Q109 19 103 29 M100 25 L103 29 L107 24"/>`,
 plank:`<circle class="person" cx="20" cy="33" r="7"/><path class="person" d="M29 34 L46 33 L77 36 L91 41 M34 36 L28 49 L18 49 M40 37 L39 48 M91 41 L98 49 M18 49 H32 M98 49 H106"/><path class="bodyfill" d="M42 32 L60 32 L60 37 L43 37 Z"/><path class="arrow" d="M43 18 H83 M43 18 L48 14 M43 18 L48 22 M83 18 L78 14 M83 18 L78 22"/>`};return `<span class="motion" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 74" focusable="false">${shapes[id]||shapes.plank}</svg></span>`}function renderWorkout(){const el=document.getElementById('workout'),existing=session(day());if(!run){el.innerHTML=`<section class="section"><div class="row"><h2>今日のワークアウト</h2><span class="pill">${mode==='short'?'短縮5分':'約15分'}</span></div>${existing?'<div class="notice">今日の完了記録があります。新しい記録も追加できます。</div>':''}${activePlan().map((x,i)=>`<div class="card exercise"><div class="num">${i+1}</div><div class="exbody"><h3>${esc(x.name)}</h3><p>${x.sets}セット × ${x.reps}${x.unit} ・ ${x.kg?x.kg+'kg':'自重／重量未設定'}</p><details><summary class="help">フォームを見る</summary><ol class="steps">${x.guide.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><p class="help">${esc(x.caution)}</p></details></div>${motionIcon(x.id)}</div>`).join('')}<button class="btn" id="begin">この内容で開始</button><button class="btn outline section" id="cfg">回数や重量を変更</button></section>`;document.getElementById('begin').onclick=()=>{run={index:0,done:0,records:[],startedAt:new Date().toISOString()};renderWorkout();positionNav()};document.getElementById('cfg').onclick=()=>{currentTab='settings';['home','workout','progress','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!=='settings'));render()};return}const list=activePlan(),x=list[run.index];if(!x){finish();return}const total=list.reduce((a,x)=>a+x.sets,0),finished=run.records.length;el.innerHTML=`<section class="section"><div class="row"><h2>トレーニング中</h2><span class="pill">${finished}/${total} セット</span></div><div class="meter"><i style="width:${Math.round(finished/total*100)}%"></i></div><div class="card hero"><span class="tag">種目 ${run.index+1} / ${list.length}</span><h2>${esc(x.name)}</h2><p>セット ${run.done+1} / ${x.sets}</p><div class="formgrid"><div class="field"><label>${x.unit==='秒'?'秒数':'回数（左右種目は片側）'}</label><input id="reps" type="number" min="1" max="300" value="${x.reps}" inputmode="numeric"></div><div class="field"><label>重量 kg</label><input id="kg" type="number" min="0" max="100" step="0.5" value="${x.kg}" inputmode="decimal"></div></div><button id="doneSet" class="btn">このセットを完了 ✓</button><button id="skipEx" class="btn secondary" style="margin-top:10px">この種目をスキップ</button></div><div class="card"><b>フォームのポイント</b><ol class="steps">${x.guide.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><p class="notice">${esc(x.caution)}</p></div><button class="btn outline" id="endEarly">ここまでで終了・記録</button><p class="help">痛みや強い疲労があれば無理せず中止してください。</p></section>`;document.getElementById('doneSet').onclick=()=>{const reps=Number(document.getElementById('reps').value),kg=Number(document.getElementById('kg').value);if(!Number.isFinite(reps)||reps<1||reps>300||!Number.isFinite(kg)||kg<0||kg>100)return toast('回数・重量を確認してください');run.records.push({exerciseId:x.id,name:x.name,unit:x.unit,reps,kg,at:new Date().toISOString()});run.done++;if(run.done>=x.sets){run.index++;run.done=0}if(run.index>=list.length)finish();else {renderWorkout();positionNav()}};document.getElementById('skipEx').onclick=()=>{run.index++;run.done=0;if(run.index>=list.length)finish();else {renderWorkout();positionNav()}};document.getElementById('endEarly').onclick=finish}function finish(){const r=run;run=null;if(r.records.length===0){toast('記録するセットがありません');renderWorkout();return}const entry={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),date:day(),status:'completed',mode,startedAt:r.startedAt,completedAt:new Date().toISOString(),sets:r.records};db.sessions.push(entry);save();const e=document.getElementById('workout');e.innerHTML=`<div class="card hero section"><span class="tag">✓ 完了</span><h2>今日の一歩を記録しました</h2><p>${r.records.length}セットを記録しました。次回も無理のない範囲で。</p><div class="notice">次回の小さな目標を選んでください（任意）</div><div class="btnrow" style="margin-top:12px"><button class="btn secondary sm goal" data-goal="同じ内容を続ける">同じ内容</button><button class="btn secondary sm goal" data-goal="フォームを丁寧にする">フォーム重視</button></div><button class="btn section" id="goProgress">記録を確認する</button></div>`;positionNav();e.querySelectorAll('.goal').forEach(b=>b.onclick=()=>{db.goals[day()]=b.dataset.goal;save();toast('次回の目標を保存しました')});document.getElementById('goProgress').onclick=()=>setTab('progress')}
function renderProgress(){const now=day(),s=stats();let begin=new Date(dateOf(now).getFullYear(),dateOf(now).getMonth(),1),yr=begin.getFullYear(),mo=begin.getMonth(),last=new Date(yr,mo+1,0).getDate(),wd=(begin.getDay()+6)%7;let cell=['月','火','水','木','金','土','日'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<wd;i++)cell+='<div></div>';for(let i=1;i<=last;i++){const k=`${yr}-${z(mo+1)}-${z(i)}`,done=!!session(k),cl=done?'done':planned(k)&&k<=now?'': 'rest';cell+=`<div class="day ${cl}" title="${k}${done?' 実施':''}">${i}${done?'✓':''}</div>`}let weeks=[];for(let i=3;i>=0;i--){let count=0;for(let j=0;j<7;j++){let d=add(now,-i*7-j);if(session(d))count++}weeks.push(count)}document.getElementById('progress').innerHTML=`<section class="section"><h2>成長ダッシュボード</h2><div class="grid"><div class="stat"><strong>${s.rate}%</strong><span>28日実施率</span></div><div class="stat"><strong>${s.done}/${s.plan}</strong><span>予定日中の実施</span></div><div class="stat"><strong>${db.sessions.length}</strong><span>総記録回数</span></div></div><div class="card"><b>${yr}年${mo+1}月の活動カレンダー</b><div class="cal" style="margin-top:18px">${cell}</div><p class="help">緑：運動を記録した日。休息日は未達成に数えません。</p></div><div class="card"><b>過去4週間の運動回数</b><div class="barlist">${weeks.map((n,i)=>`<div class="barcol"><div style="height:112px;display:flex;align-items:end"><div class="bar" style="height:${Math.max(3,n/7*112)}px;width:100%"></div></div><b>${n}回</b><div>${i===3?'今週':`${3-i}週前`}</div></div>`).join('')}</div></div><div class="card"><div class="row"><b>実施履歴</b><span class="pill">新しい順</span></div>${db.sessions.length?db.sessions.slice().reverse().slice(0,12).map(x=>`<p class="help" style="border-bottom:1px solid #344757;padding-bottom:9px"><strong>${esc(x.date)}</strong> ・ ${x.sets.length}セット ・ ${x.mode==='short'?'5分モード':'通常'}<br>${esc([...new Set(x.sets.map(s=>s.name))].join('、'))}</p>`).join(''):'<p class="help">まだ運動記録はありません。</p>'}</div><div class="card"><b>週の振り返り</b><p class="help">今週、自分に合っていたことを選んでください。</p><div class="btnrow"><button class="btn secondary sm review" data-v="朝の時間がよかった">朝の時間</button><button class="btn secondary sm review" data-v="短時間がよかった">短時間</button><button class="btn secondary sm review" data-v="今のまま続けたい">このまま</button></div><p class="help" id="reviewText">${db.lastReview?'前回：'+esc(db.lastReview):''}</p></div></section>`;document.querySelectorAll('.review').forEach(b=>b.onclick=()=>{db.lastReview=b.dataset.v;save();document.getElementById('reviewText').textContent='保存：'+db.lastReview;toast('振り返りを保存しました')})}
function renderSettings(){document.getElementById('settings').innerHTML=`<section class="section"><h2>設定とバックアップ</h2><div class="notice">種目・回数・重量は目安です。違和感や痛みがある場合は無理せず調整しましょう。</div>${db.plan.map((x,i)=>`<div class="card"><b>${esc(x.name)}</b><div class="formgrid"><div class="field"><label>回数／秒数</label><input id="r${i}" type="number" min="1" max="300" value="${x.reps}"></div><div class="field"><label>セット数</label><input id="s${i}" type="number" min="1" max="10" value="${x.sets}"></div><div class="field"><label>重量 kg</label><input id="k${i}" type="number" min="0" max="100" step="0.5" value="${x.kg}"></div></div></div>`).join('')}<button id="savePlan" class="btn">メニューを保存</button><div class="card"><b>データのバックアップ</b><p class="help">端末内の記録は、ブラウザデータの削除や機種変更で消えることがあります。定期的にバックアップしてください。</p><button class="btn secondary" id="export">JSONファイルを保存</button><label class="field" style="display:block;margin-top:12px"><span class="help">バックアップを読み込む（現在のデータと置き換え）</span><input id="import" type="file" accept=".json,application/json" style="margin-top:8px"></label></div><button class="btn outline" id="back">HOMEに戻る</button></section>`;document.getElementById('savePlan').onclick=()=>{const next=db.plan.map((x,i)=>({...x,reps:Number(document.getElementById('r'+i).value),sets:Number(document.getElementById('s'+i).value),kg:Number(document.getElementById('k'+i).value)}));if(next.some(x=>!Number.isInteger(x.reps)||x.reps<1||x.reps>300||!Number.isInteger(x.sets)||x.sets<1||x.sets>10||!Number.isFinite(x.kg)||x.kg<0||x.kg>100))return toast('入力値を確認してください');db.plan=next;save();toast('メニューを保存しました')};document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='morning-quest-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming.sessions)||!Array.isArray(incoming.plan)||typeof incoming.created!=='string')throw Error();if(!confirm('現在の記録をバックアップの内容で置き換えますか？'))return;db=incoming;save();toast('復元しました');renderSettings()}catch{toast('バックアップ形式が正しくありません')}};document.getElementById('back').onclick=()=>setTab('home')}
function positionNav(){const n=document.querySelector('nav.bottom');const b=document.getElementById('begin');if(currentTab==='workout'&&!run&&b){b.before(n)}else{document.querySelector('.footer').before(n)}}function render(){if(currentTab==='home')renderHome();if(currentTab==='workout')renderWorkout();if(currentTab==='progress')renderProgress();if(currentTab==='settings')renderSettings();positionNav()}save();render();if('serviceWorker'in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
